services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JOB_RUNNER_URL=http://job-runner:3001
      # S3 configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      # Meilisearch configuration
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-http://meilisearch:7700}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
    depends_on:
      - job-runner
    restart: unless-stopped

  job-runner:
    build: .
    command: ["bun", "run", "src/job-runner.ts"]
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JOB_RUNNER_PORT=3001
      # S3 configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      # Meilisearch configuration
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-http://meilisearch:7700}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
    restart: unless-stopped

  # Optional: Include Meilisearch for local development
  # Uncomment if you want to run Meilisearch in the same compose stack
  # meilisearch:
