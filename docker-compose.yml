services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JOB_RUNNER_URL=http://job-runner:3001
      # S3 configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      # SQLite configuration
      - SQLITE_DB_PATH=/app/data/search.sqlite
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - job-runner
    restart: unless-stopped

  job-runner:
    build: .
    command: ["npm", "run", "job-runner"]
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JOB_RUNNER_PORT=3001
      # S3 configuration
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      # SQLite configuration
      - SQLITE_DB_PATH=/app/data/search.sqlite
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
